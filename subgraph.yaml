specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SocietyProtocolBadges
    network: sepolia
    source:
      abi: SocietyProtocolBadges
      address: "0x21d798f885609b228D05a75f8bD9a4De538fbf11"
      startBlock: 9853527
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - BadgeCreated
        - HookUpdated
        - ProfileCreated
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
      abis:
        - name: SocietyProtocolBadges
          file: ./abis/SocietyProtocolBadges.json
      eventHandlers:
        - event: BadgeCreated(indexed uint256,string,bool)
          handler: handleBadgeCreated
        - event: HookUpdated(indexed uint256,indexed address)
          handler: handleHookUpdated
        - event: ProfileCreated(indexed address,indexed uint256)
          handler: handleProfileCreated
        - event: URI(string,indexed uint256)
          handler: handleURI
        - event: TransferSingle(indexed address,indexed address,indexed
            address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed
            address,uint256[],uint256[])
          handler: handleTransferBatch
      file: ./src/society-protocol-badges.ts
