specVersion: 0.0.4
features:
  - fullTextSearch
  - ipfsOnEthereumContracts
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SocietyProtocolBadges
    network: { { network } }
    source:
      abi: SocietyProtocolBadges
      address: "{ { SocietyProtocolBadges.address } }"
      startBlock: { { SocietyProtocolBadges.startBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BadgeCreated
        - HookUpdated
        - PermissionsUpdated
        - ProfileCreated
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - EditorsUpdated
      abis:
        - name: SocietyProtocolBadges
          file: ./abis/SocietyProtocolBadges.json
      eventHandlers:
        - event: BadgeCreated(indexed uint256,string,bool,bool,indexed address)
          handler: handleBadgeCreated
        - event: HookUpdated(indexed uint256,indexed address)
          handler: handleHookUpdated
        - event: ProfileCreated(indexed address,indexed uint256)
          handler: handleProfileCreated
        - event: URI(string,indexed uint256)
          handler: handleURI
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
        - event: EditorsUpdated(indexed uint256,indexed address,bool)
          handler: handleEditorsUpdated
      file: ./src/society-protocol-badges.ts
  - kind: ethereum
    name: EasyAuction
    network: { { network } }
    source:
      address: "{ { EasyAuction.address } }"
      abi: EasyAuction
      startBlock: { { EasyAuction.startBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AuctionCleared
        - CancellationSellOrder
        - ClaimedFromOrder
        - NewAuction
        - NewSellOrder
        - NewUser
        - OwnershipTransferred
        - UserRegistration
      abis:
        - name: EasyAuction
          file: ./abis/EasyAuction.json
        - name: ERC20Contract
          file: ./abis/ERC20.json
      eventHandlers:
        - event: AuctionCleared(indexed uint256,uint96,uint96,bytes32)
          handler: handleAuctionCleared
        - event: CancellationSellOrder(indexed uint256,indexed uint64,uint96,uint96)
          handler: handleCancellationSellOrder
        - event: ClaimedFromOrder(indexed uint256,indexed uint64,uint96,uint96)
          handler: handleClaimedFromOrder
        - event: NewAuction(indexed uint256,indexed address,indexed address,uint256,uint256,uint64,uint96,uint96,uint256,uint256,address,bytes)
          handler: handleNewAuction
        - event: NewSellOrder(indexed uint256,indexed uint64,uint96,uint96)
          handler: handleNewSellOrder
        - event: NewUser(indexed uint64,indexed address)
          handler: handleNewAuctionUser
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: UserRegistration(indexed address,uint64)
          handler: handleUserRegistration
      file: ./src/easy-auction.ts
