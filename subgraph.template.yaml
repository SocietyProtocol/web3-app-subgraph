specVersion: 0.0.7
features:
  - fullTextSearch
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SocietyProtocolBadges
    network: { { network } }
    source:
      abi: SocietyProtocolBadges
      address: "{ { SocietyProtocolBadges.address } }"
      startBlock: { { SocietyProtocolBadges.startBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BadgeCreated
        - BadgeModified
        - HookUpdated
        - ProfileCreated
        - URI
        - TransferSingle
        - TransferBatch
        - EditorsUpdated
        - BadgePermissions
      abis:
        - name: SocietyProtocolBadges
          file: ./abis/SocietyProtocolBadges.json
      eventHandlers:
        - event: BadgeCreated(indexed uint256,string,bool,bool,indexed address)
          handler: handleBadgeCreated
        - event: BadgeModified(indexed uint256,string,bool,bool,string)
          handler: handleBadgeModified
        - event: HookUpdated(indexed uint256,indexed address)
          handler: handleHookUpdated
        - event: ProfileCreated(indexed address,indexed uint256)
          handler: handleProfileCreated
        - event: URI(string,indexed uint256)
          handler: handleURI
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
        - event: EditorsUpdated(indexed uint256,indexed address,bool)
          handler: handleEditorsUpdated
        - event: BadgePermissions(indexed uint256,uint256[],uint256[],uint256[],address[])
          handler: handleBadgePermissions
        - event: UserInvited(indexed address,indexed address,uint256)
          handler: handleUserInvited
      file: ./src/society-protocol-badges.ts
  - kind: ethereum
    name: EasyAuction
    network: { { network } }
    source:
      address: "{ { EasyAuction.address } }"
      abi: EasyAuction
      startBlock: { { EasyAuction.startBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AuctionCleared
        - CancellationSellOrder
        - ClaimedFromOrder
        - NewAuction
        - NewSellOrder
        - NewUser
        - OwnershipTransferred
        - UserRegistration
      abis:
        - name: EasyAuction
          file: ./abis/EasyAuction.json
        - name: ERC20Contract
          file: ./abis/ERC20.json
      eventHandlers:
        - event: AuctionCleared(indexed uint256,uint96,uint96,bytes32)
          handler: handleAuctionCleared
        - event: CancellationSellOrder(indexed uint256,indexed uint64,uint96,uint96)
          handler: handleCancellationSellOrder
        - event: ClaimedFromOrder(indexed uint256,indexed uint64,uint96,uint96)
          handler: handleClaimedFromOrder
        - event: NewAuction(indexed uint256,indexed address,indexed address,uint256,uint256,uint64,uint96,uint96,uint256,uint256,address,bytes)
          handler: handleNewAuction
        - event: NewSellOrder(indexed uint256,indexed uint64,uint96,uint96)
          handler: handleNewSellOrder
        - event: NewUser(indexed uint64,indexed address)
          handler: handleNewAuctionUser
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: UserRegistration(indexed address,uint64)
          handler: handleUserRegistration
      file: ./src/easy-auction.ts
  # {{#vipManager}}
  - kind: ethereum
    name: SocietyVipManager
    network: { { network } }
    source:
      address: "{ { vipManager.address } }"
      abi: SocietyVipManager
      startBlock: { { vipManager.startBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LockTransaction
        - Community
      abis:
        - name: SocietyVipManager
          file: ./abis/SocietyVipManager.json
      eventHandlers:
        - event: TokensLocked(indexed address,uint256,uint256)
          handler: handleTokensLocked
        - event: TokensUnlocked(indexed address,uint256)
          handler: handleTokensUnlocked
        - event: CommunityTierGranted(indexed uint256,uint256,uint256)
          handler: handleCommunityTierGranted
        - event: CommunityTierRevoked(indexed uint256)
          handler: handleCommunityTierRevoked
      file: ./src/vip-manager.ts
  # {{/vipManager}}
  # {{#CommunityRegistry}}
  - kind: ethereum
    name: CommunityRegistry
    network: { { network } }
    source:
      abi: CommunityRegistry
      address: "{ { CommunityRegistry.address } }"
      startBlock: { { CommunityRegistry.startBlock } }
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CommunityCreated
        - CommunityBadgeCreated
        - CommunityDetailsUpdated
      abis:
        - name: CommunityRegistry
          file: ./abis/CommunityRegistry.json
      eventHandlers:
        - event: CommunityCreated(indexed uint256,indexed address,uint256,uint256)
          handler: handleCommunityCreated
        - event: CommunityBadgeCreated(indexed uint256,indexed uint256)
          handler: handleCommunityBadgeCreated
        - event: CommunityDetailsUpdated(indexed uint256,string,string)
          handler: handleCommunityDetailsUpdated
      file: ./src/community-registry.ts
# {{/CommunityRegistry}}
templates:
  - kind: file/ipfs
    name: MetadataFile
    mapping:
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Metadata
      abis:
        - name: SocietyProtocolBadges
          file: ./abis/SocietyProtocolBadges.json
      handler: handleMetadata
      file: ./src/metadata.ts
