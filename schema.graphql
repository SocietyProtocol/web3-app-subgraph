type User @entity(immutable: false) {
  id: ID!
  name: String
  bio: String
  imageUrl: String
  profile: Badge
  badges: [Badge!]!
  managedBadges: [Badge!]!
}

type Badge @entity(immutable: false) {
  id: ID!
  name: String!
  isOfficial: Boolean!
  isCommunity: Boolean!
  isProfile: Boolean!
  uri: String
  hookAddress: Bytes!
  creatorAddress: String!
  createdAt: BigInt!
  imageUrl: String
  createdBy: User!
  managers: [User!]! @derivedFrom(field: "managedBadges")
  minters: [Badge!]!
  burners: [Badge!]!
  transferers: [Badge!]!
  holders: [User!]! @derivedFrom(field: "badges")
  holdersCount: BigInt!
  profileUser: User
}

type _Schema_
  @fulltext(
    name: "badgeSearch"
    language: en
    algorithm: rank
    include: [
      {
        entity: "Badge"
        fields: [{ name: "id" }, { name: "name" }, { name: "creatorAddress" }]
      }
    ]
  )

type Order @entity(immutable: false) {
  id: ID!
  auctionId: BigInt!
  sellAmount: BigInt!
  buyAmount: BigInt! # uint256
  auctionUser: AuctionUser!
  userAddress: Bytes!
  price: BigDecimal!
  volume: BigDecimal!
  timestamp: BigInt!
}

type AuctionUser @entity(immutable: false) {
  id: ID!
  address: Bytes!
  auctions: [AuctionDetail!]!
  user: User
  orders: [Order!]! @derivedFrom(field: "auctionUser")
}

type LockTransaction @entity(immutable: true) {
  id: ID!
  userAddress: Bytes!
  user: User
  amount: BigInt!
  lockDate: BigInt
  unlockDate: BigInt!
  type: String!
}

type AuctionDetail @entity(immutable: false) {
  id: ID!
  auctionId: BigInt!
  exactOrder: Order!
  chainId: String!
  orders: [Order!]
  ordersWithoutClaimed: [Order!]
  symbolAuctioningToken: String!
  symbolBiddingToken: String!
  addressAuctioningToken: Bytes!
  addressBiddingToken: Bytes!
  decimalsAuctioningToken: BigInt!
  decimalsBiddingToken: BigInt!
  endTimeTimestamp: BigInt!
  orderCancellationEndDate: BigInt!
  startingTimeStamp: BigInt!
  minimumBiddingAmountPerOrder: BigInt!
  minFundingThreshold: BigInt!
  allowListManager: Bytes!
  allowListSigner: Bytes!
  currentVolume: BigDecimal!
  currentClearingOrderSellAmount: BigInt!
  currentClearingOrderBuyAmount: BigInt!
  currentClearingPrice: BigDecimal!
  currentBiddingAmount: BigInt!
  isAtomicClosureAllowed: Boolean!
  isPrivateAuction: Boolean!
  interestScore: BigDecimal!
  usdAmountTraded: BigDecimal!
}
